<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>:root {
    --bg: #0a0a0b;
    --card: rgba(22, 22, 24, 0.85);
    --border: rgba(255, 255, 255, 0.07);
    --text: #f5f5f4;
    --muted: #a1a1aa;
    --accent: #d4a373;          /* warm gold */
    --accent-soft: #e8d5b5;
    --gold: #c9a227;
  }
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
  }
  
  body {
  background: 
    linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
    radial-gradient(ellipse at top, #161616 0%, #0a0a0b 65%);
  background-size: 44px 44px, 44px 44px, 100% 100%;
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}
  
  /* Subtle vignette */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 1;
  }
  
  .navbar-wrapper {
    padding: 18px 24px;
    position: relative;
    z-index: 2;
  }
  
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 26px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }
  
  .navbar strong {
    color: var(--accent);
    font-size: 18px;
    letter-spacing: 0.3px;
    font-weight: 600;
  }
  
  select {
    background: #1c1c1e;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 8px;
    margin-left: 16px;
    outline: none;
    cursor: pointer;
    font-size: 13px;
  }
  
  .user-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  
  .container {
    display: flex;
    padding: 0 24px 24px;
    gap: 20px;
    height: calc(100vh - 95px);
    position: relative;
    z-index: 2;
  }
  
  .sidebar {
    width: 68px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 22px 0;
  }
  
  .top-icons {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  
  .icon, .logout {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0.55;
    transition: 0.25s;
    font-size: 17px;
  }
  
  .icon:hover {
    color: var(--accent);
    opacity: 1;
  }
  
  .logout:hover {
    color: #e07a5f;
    opacity: 1;
  }
  
  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }
  
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 16px;
    backdrop-filter: blur(8px);
  }
  
  #topics {
    flex: 1;
    overflow-y: auto;
    padding-right: 6px;
  }
  
  #topics::-webkit-scrollbar {
    width: 5px;
  }
  
  #topics::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 10px;
  }
  
  .topic-header {
    display: flex;
    justify-content: space-between;
    padding: 13px 16px;
    margin-top: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.025);
    cursor: pointer;
    transition: 0.2s;
    font-size: 14px;
  }
  
  .topic-header:hover {
    background: rgba(212, 163, 115, 0.08);
  }
  
  .subtopics {
    margin-left: 12px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out;
  }
  
  .sub {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 14px;
    margin: 5px 0;
    border-radius: 9px;
    background: rgba(255,255,255,0.02);
    font-size: 13.5px;
  }
  
  .sub input[type="checkbox"] {
    width: 15px;
    height: 15px;
    cursor: pointer;
    accent-color: var(--accent);
  }
  
  .right {
    width: 300px;
  }
  
  .circle-box {
    position: relative;
    width: 170px;
    height: 170px;
    margin: 12px auto;
  }
  
  svg {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotate(-90deg);
  }
  
  .bg-ring {
    stroke: #1f1f22;
    stroke-width: 11;
    fill: none;
  }
  
  .progress-ring {
    stroke: var(--accent);
    stroke-width: 11;
    stroke-linecap: round;
    fill: none;
    transition: stroke-dashoffset 0.6s ease;
  }
  
  .circle-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  
  .circle-text strong {
    font-size: 26px;
    color: var(--accent-soft);
    font-weight: 600;
  }
  
  .small {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  
  .next-topic {
    font-size: 14px;
    padding: 13px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    margin-top: 8px;
    line-height: 1.45;
    color: #d4d4d8;
  }
  
  .streak-value {
    font-size: 32px;
    font-weight: 600;
    color: var(--accent);
    margin-top: 6px;
  }
  
  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #18181b;
    color: #f5f5f4;
    padding: 14px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    font-size: 14px;
    z-index: 9999;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s ease;
    pointer-events: none;
  }
  
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  
  .toast.success {
    border-left: 4px solid var(--accent);
  }
  
  .toast.error {
    border-left: 4px solid #e07a5f;
  }
  
  /* Empty + Loading */
  .empty-state, .loading-state {
    text-align: center;
    padding: 55px 20px;
    color: var(--muted);
  }
  
  .empty-state i, .loading-state i {
    font-size: 38px;
    margin-bottom: 14px;
    opacity: 0.45;
    color: var(--accent);
  }
  
  .empty-state h3 {
    font-size: 17px;
    margin-bottom: 8px;
    color: var(--text);
  }
  
  .loading-state i {
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  </style>
</head>
<body>

  <div class="navbar-wrapper">
    <div class="navbar">
      <div>
        <strong>Code Tracker</strong>
        <select id="language" onchange="changeLanguage()">
          <option value="Python">Python</option>
          <option value="Java">Java</option>
          <option value="C++">C++</option>
          <option value="JavaScript">JavaScript</option>
        </select>
      </div>
      <div class="user-info">
        <i class="fa-solid fa-user"></i>
        <span id="usernameDisplay">User</span>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="top-icons">
        <div class="icon" title="Home"><i class="fa-solid fa-house"></i></div>
        <div class="icon" title="Progress"><i class="fa-solid fa-chart-line"></i></div>
        <div class="icon" title="Settings"><i class="fa-solid fa-gear"></i></div>
      </div>
      <div class="logout" onclick="logout()" title="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </div>
    </div>

    <!-- Center - Topics -->
    <div class="center">
      <div class="card">
        <h3 id="title">Python Roadmap</h3>
        <p id="progressText" class="small">0% completed</p>
      </div>
      <div class="card" id="topics" style="flex:1; overflow-y:auto;"></div>
    </div>

    <!-- Right Panel -->
    <div class="right">
      <div class="card">
        <h4>Progress</h4>
        <div class="circle-box">
          <svg width="180" height="180">
            <defs>
              <linearGradient id="grad">
                <stop offset="0%" stop-color="#06b6d4"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <circle cx="90" cy="90" r="70" class="bg-ring"></circle>
            <circle cx="90" cy="90" r="70" class="progress-ring" id="ring"></circle>
          </svg>
          <div class="circle-text"><strong id="percent">0%</strong></div>
        </div>
      </div>

      <div class="card" style="text-align:center;">
        <h4>Streak</h4>
        <div class="streak-value" id="streak">0</div>
        <div class="small">days</div>
      </div>

      <div class="card">
        <h4>Next Topic</h4>
        <div class="next-topic" id="nextTopic">Start your journey</div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

<script>
  // ======================
  // STATE
  // ======================
  let user_id = localStorage.getItem("user_id");
  let username = localStorage.getItem("username") || "User";
  let currentLang = "Python";

  // Redirect to login if not logged in
  if (!user_id) {
    window.location.href = "/login-page";
  }

  // Show username
  document.getElementById("usernameDisplay").innerText = username;

  // Mouse light effect
  document.addEventListener("mousemove", (e) => {
    document.body.style.setProperty("--x", e.clientX + "px");
    document.body.style.setProperty("--y", e.clientY + "px");
  });

  // ======================
  // TOAST FUNCTION
  // ======================
  function showToast(message, type = "success") {
    const toast = document.getElementById("toast");
    toast.innerText = message;
    toast.className = `toast ${type} show`;

    setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
  }

  // ======================
  // ROADMAP DATA
  // ======================
  const roadmapData = {
    Python: {
      "Phase 1: Basics": [
        "Install Python & setup VS Code", "Learn syntax & indentation",
        "Variables & Data Types", "Input / Output", "Operators",
        "Conditional Statements (if-else)", "Loops (for, while)",
        "Functions", "Basic error handling"
      ],
      "Phase 2: Core Python": [
        "Lists, Tuples, Sets", "Dictionaries", "String manipulation",
        "List Comprehensions", "Functions (advanced)", "Modules & Packages",
        "File Handling", "Exception Handling"
      ],
      "Phase 3: Intermediate": [
        "Object-Oriented Programming (OOP)", "Classes & Objects",
        "Inheritance & Polymorphism", "Lambda functions",
        "Map, Filter, Reduce", "Decorators (basic)",
        "Virtual Environments", "Working with APIs"
      ],
      "Phase 4: Advanced": [
        "Multithreading & Multiprocessing", "Async Programming",
        "Generators & Iterators", "Logging",
        "Testing (unittest / pytest)", "Performance Optimization"
      ],
      "Phase 5: Web Development": [
        "Flask / Django", "REST APIs", "Authentication", "Deployment"
      ],
      "Projects: Beginner": [
        "Calculator", "Number Guessing Game", "Password Generator",
        "To-Do List (CLI)", "Quiz Game"
      ],
      "Projects: Intermediate": [
        "Weather App (API)", "Expense Tracker", "File Organizer",
        "URL Shortener", "Web Scraper"
      ]
    },
    Java: {
      "Basics": ["Syntax", "JVM Structure", "OOP Concepts", "Collections"],
      "Advanced": ["Spring Boot", "Hibernate", "Multithreading"]
    },
    "C++": {
      "Basics": ["Pointers", "Memory Management", "STL", "OOP"],
      "Advanced": ["Templates", "Concurrency", "Smart Pointers"]
    },
    JavaScript: {
      "Basics": ["DOM Manipulation", "ES6+ Syntax", "Fetch API", "Async/Await"],
      "Frameworks": ["React", "Node.js", "Express"]
    }
  };

  // ======================
  // CORE FUNCTIONS
  // ======================
  async function load() {
  // Show loading state
  document.getElementById("topics").innerHTML = `
    <div class="loading-state">
      <i class="fa-solid fa-spinner"></i>
      <div>Loading roadmap...</div>
    </div>
  `;

  let saved = {};
  try {
    const res = await fetch("/get-progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id, language: currentLang })
    });
    const data = await res.json();
    (data.topics || []).forEach(t => saved[t] = 1);
  } catch (e) {
    console.log("Could not load progress");
  }

  renderTopics(saved);
  updateUI();
  loadStreak();
}

  function renderTopics(saved) {
    const roadmap = roadmapData[currentLang];
    let html = "";
    let hasAnyTopic = false;

    for (let phase in roadmap) {
      hasAnyTopic = true;
      html += `
        <div class="topic-header" onclick="toggle(this)">
          <span>${phase}</span>
          <span>⌄</span>
        </div>
        <div class="subtopics">`;

      roadmap[phase].forEach(topic => {
        const checked = saved[topic] ? "checked" : "";
        html += `
          <div class="sub">
            <span>${topic}</span>
            <input type="checkbox" ${checked} onchange="handleCheck()">
          </div>`;
      });

      html += `</div>`;
    }

    if (!hasAnyTopic) {
      html = `
        <div class="empty-state">
          <i class="fa-solid fa-book-open"></i>
          <h3>No roadmap available</h3>
          <p>Select another language to get started.</p>
        </div>`;
    }

    document.getElementById("topics").innerHTML = html;
  }

  async function handleCheck() {
    const saved = [];
    document.querySelectorAll("input[type=checkbox]").forEach(cb => {
      if (cb.checked) {
        saved.push(cb.parentElement.querySelector("span").innerText);
      }
    });

    updateUI();

    try {
      await fetch("/save-progress", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id,
          language: currentLang,
          topics: saved
        })
      });

      loadStreak();
      showToast("Progress saved ✓");
    } catch (e) {
      showToast("Failed to save progress", "error");
    }
  }

  function updateUI() {
    const roadmap = roadmapData[currentLang];
    const allTopics = Object.values(roadmap).flat();
    const checkboxes = document.querySelectorAll("input[type=checkbox]");

    let doneCount = 0;
    let firstMissing = "All topics completed 🎉";
    let found = false;

    checkboxes.forEach(cb => {
      if (cb.checked) doneCount++;
      else if (!found) {
        firstMissing = cb.parentElement.querySelector("span").innerText;
        found = true;
      }
    });

    const percent = allTopics.length === 0 ? 0 : Math.round((doneCount / allTopics.length) * 100);

    document.getElementById("progressText").innerText = `${percent}% completed`;
    document.getElementById("percent").innerText = `${percent}%`;
    document.getElementById("nextTopic").innerText = firstMissing;

    const circ = 2 * Math.PI * 70;
    const ring = document.getElementById("ring");
    ring.style.strokeDasharray = circ;
    ring.style.strokeDashoffset = circ - (percent / 100) * circ;
  }

  async function loadStreak() {
    try {
      const res = await fetch("/get-streak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id })
      });
      const data = await res.json();
      document.getElementById("streak").innerText = data.streak || 0;
    } catch (e) {
      document.getElementById("streak").innerText = 0;
    }
  }

  function toggle(el) {
    const sub = el.nextElementSibling;
    if (sub.style.maxHeight && sub.style.maxHeight !== "0px") {
      sub.style.maxHeight = "0px";
    } else {
      sub.style.maxHeight = sub.scrollHeight + "px";
    }
  }

  function changeLanguage() {
    currentLang = document.getElementById("language").value;
    document.getElementById("title").innerText = currentLang + " Roadmap";
    load();
  }

  function logout() {
    localStorage.removeItem("user_id");
    localStorage.removeItem("username");
    window.location.href = "/login-page";
  }

  // Start
  load();
</script>
</body>
</html>
